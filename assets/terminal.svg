<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Abdulaziz Toba — AI Engineer</title>
  <desc id="desc">An original terminal scene with an AT monogram, an animated wireframe eye, and two tracking lines. Self-hosted LLMs, agents, and inference. Visit aziztoba.github.io for the interactive portfolio.</desc>
  <style>
    text { font-family: 'IBM Plex Mono', 'DejaVu Sans Mono', monospace; }
    .scan { animation: gaze 9s ease-in-out infinite; }
    .guide { stroke-dasharray: 3 7; }
    @keyframes gaze { 0%,100% { transform:translate(0,0) } 35% { transform:translate(12px,-5px) } 70% { transform:translate(-9px,4px) } }
    @media (prefers-reduced-motion:reduce) { .scan { animation:none; } }
  </style>
  <defs>
